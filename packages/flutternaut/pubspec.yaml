name: flutternaut
description: "In-app HTTP bridge for Flutter E2E automation. One call in main() exposes the live widget tree (find, tap, type, scroll, assert) to the Flutternaut engine — no Semantics wrappers."
version: 0.0.6
homepage: https://flutternaut.app
repository: https://github.com/KhaledMoSha/flutternaut
topics:
  - flutter
  - testing
  - widget-tree
  - e2e-testing
  - automation
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # flutternaut_generator: ^0.0.4
  flutternaut_generator:
    path: ../flutternaut_generator

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  flutternaut: flutternaut
